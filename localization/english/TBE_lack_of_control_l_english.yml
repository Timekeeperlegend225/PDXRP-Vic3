 unknow_populationy_yes_loc:"\n @warning! #b #red [ROOT.Var('national_unknow_population_share_var').GetValue] #white states have #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_unknow_population_tt $TBE_unknow_population$#! #! #! #! [ROOT.GetCountry.GetCustom('unknow_population_percent_loc')] \nTo get rid of it you need to :  \n @turns_into! #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_census1_tt Conduct a census#! on the wanted state \n Once a state is fully accounted, the modifier will become #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_unidentified_population_tt $TBE_unidentified_population$#!" 
 unidentified_populationy_yes_loc:"\n @warning! #b #red [ROOT.Var('national_unidentified_population_share_var').GetValue] #white states have #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_unidentified_population_tt $TBE_unidentified_population$#! #! #! #! [ROOT.GetCountry.GetCustom('unidentified_population_percent_loc')] \nTo get rid of it you need to : \n [ROOT.GetCountry.GetCustom('central_archive_checkbox')] Have researched [GetTechnology('central_archives').GetName] \n [ROOT.GetCountry.GetCustom('no_serfdom_checkbox')] Have abolished [ROOT.GetCountry.GetCustom('chinese_or_not_serfdom_loc')] \n @turns_into!  #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_restored_infra1_tt restored basic infrastructure#! in the wanted state \n @turns_into! #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_census1_tt Conduct a census#! on the wanted state \n Once a state is fully accounted, the modifier will become #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_unreached_population_tt $TBE_unreached_population$#!" 
 unreached_populationy_yes_loc:"\n @warning! #b #red [ROOT.Var('national_unreached_population_share_var').GetValue] #white states have #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_unreached_population_tt $TBE_unreached_population$#! #! #! #! [ROOT.GetCountry.GetCustom('unreached_population_percent_loc')] \nTo get rid of it you need to : \n [ROOT.GetCountry.GetCustom('identification_documents_checkbox')] Have researched [GetTechnology('identification_documents').GetName] \n [ROOT.GetCountry.GetCustom('no_serfdom_checkbox')] Have abolished [ROOT.GetCountry.GetCustom('chinese_or_not_serfdom_loc')]\n [ROOT.GetCountry.GetCustom('home_affairs_institution_3_checkbox')] Have at least 1 level of [GetInstitutionType('institution_home_affairs').GetName]\n @turns_into!  #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_restored_infra2_tt restored infrastructure and basic agriculture#! in the wanted state \n @turns_into! #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_census1_tt Conduct a census#! on the wanted state \n Once a state is fully accounted, the modifier will disappear" 
 
 abysmal_infrastructure_yes_loc:"\n @warning! #b #red [ROOT.Var('national_abysmal_infrastructure_share_var').GetValue] #white states have #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_abysmal_infrastructure_tt $TBE_abysmal_infrastructure$#! #! #! #! [ROOT.GetCountry.GetCustom('abysmal_infrastructure_percent_loc')] \nTo get rid of it you need to : \n @turns_into! Use the [GetDecreeType('decree_road_maintenance').GetName] decree on the wanted state for #white 50 #! months \n Once a state infrastructure is fully restored, the modifier will become #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_overloaded_infrastructure_tt $TBE_overloaded_infrastructure$#!" 
 overloaded_infrastructure_yes_loc:"\n @warning! #b #red [ROOT.Var('national_overloaded_infrastructure_share_var').GetValue] #white states have #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_overloaded_infrastructure_tt $TBE_overloaded_infrastructure$#! #! #! #! [ROOT.GetCountry.GetCustom('overloaded_infrastructure_percent_loc')] \nTo get rid of it you need to : \n @turns_into! Have at least 1 [GetBuildingType('building_railway').GetName] with #white 80 %#! employment on the wanted state for #white 50 #! months \n Once a state infrastructure is fully improved, the modifier will become #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_lacking_infrastructure_tt $TBE_lacking_infrastructure$#!" 
 lacking_infrastructure_yes_loc:"\n @warning! #b #red [ROOT.Var('national_lacking_infrastructure_share_var').GetValue] #white states have #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_lacking_infrastructure_tt $TBE_lacking_infrastructure$#! #! #! #! [ROOT.GetCountry.GetCustom('lacking_infrastructure_percent_loc')] \nTo get rid of it you need to : \n @turns_into! #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_restored_control_tt restored minimum state control#! in the wanted state \n @turns_into! Have at least 1 [GetBuildingType('building_railway').GetName] with the #white Steel Passager Carriages #! PM, #white 100 %#! employment and #white no shortage#! on the wanted state for #white 50 #!months \n Once a state infrastructure is fully modernized, the modifier will disappear" 

 backward_agriculture_yes_loc:"\n @warning! #b #red [ROOT.Var('national_backward_agriculture_share_var').GetValue] #white states have #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_backwar_agriculture_tt $TBE_backwar_agriculture$#! #! #! #! [ROOT.GetCountry.GetCustom('backward_agriculture_percent_loc')] \nTo get rid of it you need to : \n @turns_into! #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_improve_agri_tt Improve the land#! on the wanted state \n Once a state land is fully improved, the improved will become #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_unequal_agriculture_tt $TBE_unequal_agriculture$#!" 
 exploitative_agriculture_yes_loc:"\n @warning! #b #red [ROOT.Var('national_exploitative_agriculture_share_var').GetValue] #white states have #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_exploitative_agriculture_tt $TBE_exploitative_agriculture$#! #! #! #! [ROOT.GetCountry.GetCustom('exploitative_agriculture_percent_loc')] \nTo get rid of it you need to : \n @turns_into!  #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_restored_infra1_tt restored basic infrastructure#! in the wanted state\n @turns_into! #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_improve_agri_tt Improve the land#! on the wanted state \n  Once a state land is fully improved, the modifier will become #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_unequal_agriculture_tt $TBE_unequal_agriculture$#!" 
 unequal_agriculture_yes_loc:"\n @warning! #b #red [ROOT.Var('national_unequal_agriculture_share_var').GetValue] #white states have #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_unequal_agriculture_tt $TBE_unequal_agriculture$#! #! #! #! [ROOT.GetCountry.GetCustom('unequal_agriculture_percent_loc')] \n To get rid of it you need to : \n [ROOT.GetCountry.GetCustom('no_serfdom_checkbox')] Have abolished [ROOT.GetCountry.GetCustom('chinese_or_not_serfdom_loc')] \n @turns_into! #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_restored_infra1_tt restored basic infrastructure#! in the wanted state \n @turns_into! #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_improve_agri2_tt Reform agriculture#! on the wanted state \n  Once a state agriculture is fully reformed, the modifier will become #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_subpar_agriculture_tt $TBE_subpar_agriculture$#!" 
 subpar_agriculture_yes_loc:"\n @warning! #b #red [ROOT.Var('national_subpar_agriculture_share_var').GetValue] #white states have #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_subpar_agriculture_tt $TBE_subpar_agriculture$#! #! #! #! [ROOT.GetCountry.GetCustom('subpar_agriculture_percent_loc')] \n To get rid of it you need to : \n [ROOT.GetCountry.GetCustom('no_serfdom_checkbox')] Have abolished [ROOT.GetCountry.GetCustom('chinese_or_not_serfdom_loc')] \n @turns_into! #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_restored_infra3_tt restored infrastructure and accounted population#! in the wanted state \n @turns_into! #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_improve_agri3_tt Improved agriculture#! on the wanted state \n  Once a state agriculture is fully improved, the modifier will disappear" 
 
 
