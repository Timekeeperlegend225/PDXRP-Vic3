 TBE_census11_tt: "Base Progress by month : #white 100 000 #! \nEach [GetBuildingType('building_government_administration').GetName] gives monthly progress based on its PM \n     Simple Organization add #white 500 #! \n     Horizontal Drawers Cabinets add #white 1000 #!  \n     Vertical Filling Cabinet add #white 2000 #! \n     Switch Boards add #white 5000 #! \nThe progress from [GetBuildingType('building_government_administration').GetName] is also affect by its occupancy and divided by #white 5#! if in shortage"
 TBE_restored_infra1_tt: "Removed the #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_abysmal_infrastructure_tt $TBE_abysmal_infrastructure$#! malus" 
 TBE_restored_infra2_tt: "Removed the #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_abysmal_infrastructure_tt $TBE_abysmal_infrastructure$#!, #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_overloaded_infrastructure_tt, $TBE_overloaded_infrastructure$#!, #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_backwar_agriculture_tt $TBE_backwar_agriculture$#! and #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_exploitative_agriculture_tt $TBE_exploitative_agriculture$#! maluses"
 TBE_restored_infra3_tt: "Removed the #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_abysmal_infrastructure_tt $TBE_abysmal_infrastructure$#!, #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_overloaded_infrastructure_tt, $TBE_overloaded_infrastructure$#! and #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_unknow_population_tt $TBE_unknow_population$#! maluses"
 
 TBE_restored_control_tt: "Removed the #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_unknow_population_tt $TBE_unknow_population$#!, #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_backwar_agriculture_tt $TBE_backwar_agriculture$#! and #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_exploitative_agriculture_tt $TBE_exploitative_agriculture$#! maluses"
 
 TBE_improve_agri_tt: "Use the [GetDecreeType('decree_encourage_agricultural_industry').GetName] decree until the #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_agrei1_tt Land Improved#! reach the number of arable land"
 TBE_improve_agri2_tt: "Fulfill the following condition : \n@turns_into! Have less than #white 80 #!unused arable land \n Have at least 1 [GetBuildingGroup('bg_staple_crops').GetName] building with : \n    @turns_into! the #white Fertilizers #!PM or better  \n    @turns_into! at less than #white 80%#! Employments \n    @turns_into! #white No shortage#! \n Until the #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_agrei1_tt Land Improved#! reach the number of arable land"
 TBE_improve_agri3_tt: "Fulfill the following condition : \n@turns_into! Have less than #white 20 #!unused arable land \n Have at least 1 [GetBuildingGroup('bg_staple_crops').GetName] building with : \n    @turns_into! the #white Fertilizers #!PM or better  \n    @turns_into! the #white Harvesting Tools #!PM or better \n   @turns_into! at less than #white 80%#! Employments \n    @turns_into! #white No shortage#! \n Until the #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TBE_agrei1_tt Land Improved#! reach the number of arable land"
 TBE_agrei1_tt: "Progress by month : #white 5 #! "
 
 
