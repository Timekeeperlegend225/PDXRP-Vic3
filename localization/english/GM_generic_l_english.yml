 trench_infantry_ttech:0 "Trench Works"
 trench_infantry_ttech_desc:0 "By equipping soldiers with the correct tools, it is possible for them to create strong fortifications with little effort."
 pre_dreadnought_ttech: "$ship_type_pre_dreadnought$"
 pre_dreadnought_ttech_desc: "Standardizing ship designs of battleships in order to produce a higher number of them. These ships are built from steel and powered by steam engines."
 submarine_ttech:0 "Submarine"
 submarine_ttech_desc:0 "Submarines take the concept of a boat and submerge it, leading to greater stealth and thus tactical capability."
 sea_lane_strategies_ttech:0 "Sea Lane Strategies"
 sea_lane_strategies_ttech_desc:0 "By focusing naval power on controlling the sea lanes, naval dominance is much easier to achieve."
 landing_craft_ttech:0 "Landing Craft"
 landing_craft_ttech_desc:1 "Vessels designed specifically for protecting waterborne troops greatly improve the chances of an amphibious assault actually succeeding."
 squad_infantry_ttech:0 "NCO Training"
 squad_infantry_ttech_desc:1 "It's as important to maintain a trained body of lower-ranking officers familiar with their craft as it is to maintain academy-trained captains and generals."
 siege_artillery_ttech:0 "Defense in Depth"
 siege_artillery_ttech_desc:0 "By making multiple lines of defense, it is possible to spread out and slow down the enemy and sometimes even envelop them."
 destroyer_ttech:0 "Destroyer"
 destroyer_ttech_desc:1 "Lighter vessels, equipped with torpedoes and smaller guns, are just as important in modern navies as capital ships."
 dreadnought_ttech:0 "Dreadnought"
 dreadnought_ttech_desc:0 "By making a warship with only heavy caliber guns and steam propulsion, it is possible to overpower all other types of ship."
 mobile_armor_ttech:0 "Mobile Armor"
 mobile_armor_ttech_desc:0 "By equipping a motorized vehicle with metal plating, it is possible to create an advanced weaponry platform."
 carrier_ttech:0 "Aircraft Carrier"
 carrier_ttech_desc:0 "By designing large ships with a large flat deck and equipping them appropriately, it is possible to create a sea borne airfield."
 battleship_ttech:0 "$ship_type_super_dreadnought$"
 battleship_ttech_desc:0 "By taking the dreadnought design and making all the guns high caliber, as well as some other changes, it is possible to make an even more devastating warship."
