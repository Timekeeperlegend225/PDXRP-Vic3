l_english:
 je_earn_recognition_advance:0 "#bold Monthly advance#!\nEach condition grants #bold +1#! per month unless stated otherwise. Bonuses stack.\n• [concept_gdp] in the top 10\n• [Concept('concept_gdp_per_capita','$concept_gdp_per_capita_short$')] in the top 20\n• [concept_sol] in the top 20\n• [concept_literacy] at least 40%\n• Having [Concept('concept_votes','$concept_voting_rights$')]\n• Each treaty with an active #bold $offer_embassy$#! article targeting us\n• Within 20 technologies of the world leader\n• Within 10 technologies of the world leader (additional +1)\n• Top 20 in naval power projection, with a nonzero navy\n• Top 10 in naval power projection (additional +1)\n• Top 10 in army power projection, with a nonzero army\n• Top 3 producer of Automobiles, Radios, Telephones, Engines, Explosives, Steamers, Steel, Airplanes, or Tanks (+1 for each good)\n• Having a Skyscraper\n• At least 50% of Urban Center buildings use Electric Streetlights\n• Having researched International Exchange Standards\n• Level 4 or higher Education with Public or Private Schools\n• Level 4 or higher Healthcare with Public or Private Health Insurance\n• Level 4 or higher Welfare\n• Level 4 or higher Workers Rights\n\n#bold War goals#!\nEnforcing a [concept_war_goal] on a recognized or colonial/company [concept_major_power] or above grants progress equal to four times its war goal impact."
 je_earn_recognition_deplete:0 "#bold Monthly retreat#!\nEach condition removes #bold 1#! per month unless stated otherwise. Penalties stack.\n• [concept_gdp] outside the top 30\n• [Concept('concept_gdp_per_capita','$concept_gdp_per_capita_short$')] ranked 100th or worse\n• [concept_literacy] below 20%\n• Not having abolished [concept_slavery]\n• Having [GetLawType('law_serfdom').GetName]\n• Having [GetLawType('law_traditionalism').GetName]\n• Having [GetLawType('law_isolationism').GetName]\n• Having [GetLawType('law_outlawed_dissent').GetName]\n• Having [GetLawType('law_subjecthood').GetName]\n• Having [GetLawType('law_hereditary_bureaucrats').GetName]\n• Having [GetLawType('law_peasant_levies').GetName]\n• Being a subject\n• Each foreign treaty port in a state region we also own\n• More than 30 technologies behind the world leader\n• More than 50 technologies behind the world leader (additional -1)\n• Domestic ownership of less than 50% of our GDP\n• More than 50% of our population are peasants\n• More than 75% of our population are peasants (additional -1)\n\n#bold War goals#!\nHaving a [concept_war_goal] enforced on us removes progress equal to four times its war goal impact."
 je_earn_recognition_reason:0 "The status of the #bold Progress Bar#! will #tooltippable;tooltip:[Country.GetTooltipTag],je_earn_recognition_advance advance#! or #tooltippable;tooltip:[Country.GetTooltipTag],je_earn_recognition_deplete retreat#! based on certain conditions. To become a [concept_recognized_power], [SCOPE.GetRootScope.GetCountry.GetName] must reach #bold 500#! progress, have at least Amicable relations with a Great Power, and receive GM approval.\n\nFor too long has [SCOPE.GetRootScope.GetCountry.GetNameNoFormatting] been denied proper diplomatic recognition by the so-called civilized nations of the world, leaving us vulnerable to their advances and without the ability to properly exercise our own sovereign rights.\n\nWe should do our utmost to rectify this situation, and claim a seat for ourselves at their table as respected equals."
 je_earn_recognition_complete_tt:0 "The #bold Progress Bar#! has reached #bold 500#!, signifying that our international standing has improved in the eyes of the world"
