l_english:
 pdxrp_end_pop_menace: "End the Pop Menace"
 pdxrp_end_pop_menace_desc: "Declare the Expedition defeated. The host decides when to use this after conquest, humiliation, regime change, or another decisive outcome. Available once."
 pdxrp_end_pop_menace_tt: "Destroy all Expedition barracks and all Data Centers worldwide. Kill all Pop-culture pops in the Expedition and annex its remaining territory into the host country. End the World Processing Unit and prevent its return. Remove the Expedition Megaboost and all host offense, defense and military supply adjustments worldwide."
