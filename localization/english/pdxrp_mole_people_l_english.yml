l_english:
 pdxrp_mole_people.1.t: "The Whispers of the Hollow World"
 pdxrp_mole_people.1.d: "The World Processing unit appears to have reached overdrive. Billions braced themselves for what might happen, after the deadly Katla eruption and the Pandemic. Instead, people began to hear whispers of underground sentient races buried beneath the Earth's crust. Contact with these subterranean inhabitants, called \"mole people\" in common parlance, has been limited so far, but some believe they possess riches and knowledge that are alien to the surface."
 pdxrp_mole_people.1.a: "What would happen if we traded with them?"
 pdxrp_announce_mole_people: "GM: The Coming of the Mole People"
 pdxrp_announce_mole_people_desc: "Show the event to all countries and start the shared one-year donation collection."
 je_pdxrp_mole_people: "The Whispers of the Hollow World"
 je_pdxrp_mole_people_status: "The world has sent goods worth: @money![GetGlobalVariable('pdxrp_mole_people_fund').GetValue|0]. We have sent goods worth: @money![GetPlayer.MakeScope.ScriptValue('pdxrp_mole_people_personal_donation')|0]."
 je_pdxrp_mole_people_reason: "We have heard whispers of underground sentient races buried beneath the Earth's crust. Contact with these subterranean inhabitants, called \"mole people\" in common parlance, has been limited so far, but some believe they possess riches and knowledge that are alien to the surface. We may attempt to send them goods in hopes that they will reward us."
 pdxrp_mole_people_donate_one: "Send £1 million to the Mole People!"
 pdxrp_mole_people_donate_one_desc: "Pay £1,000,000 to buy goods and send them to the Mole People. They will definitely reward us! (Repeatable)"
 pdxrp_mole_people_donate_five: "Send £5 million to the Mole People!"
 pdxrp_mole_people_donate_five_desc: "Pay £5,000,000 to buy goods and send them to the Mole People. They will definitely reward us! (Repeatable)"
 pdxrp_mole_people_blessing: "Gifts of the Mole People"
 pdxrp_mole_people_blessing_desc: "The underworld has rewarded the surface for its offerings."
 pdxrp_restore_mole_people_collection: "GM: Restore Mole People Collection"
 pdxrp_restore_mole_people_collection_desc: "Add missing donation journals to all countries without resetting the shared fund or existing journals."
 pdxrp_mole_people.2.t: "Gifts of the Mole People"
 pdxrp_mole_people.2.d: "The underworld has decided to reward the surface for its offerings. Worldwide offerings: @money![GetGlobalVariable('pdxrp_mole_people_fund').GetValue|0]. Our offerings: @money![ROOT.GetCountry.MakeScope.ScriptValue('pdxrp_mole_people_personal_donation')|0].\n\nOur reward is [ROOT.GetCountry.MakeScope.Var('pdxrp_mole_people_reward_scale').GetValue|%1] of maximum strength and decays over five years."
 pdxrp_mole_people.2.a: "God Bless the Mole People!"
 pdxrp_mole_people.3.t: "Mole People disappear"
 pdxrp_mole_people.3.d: "The Mole People were uninterested in the paltry @money![GetGlobalVariable('pdxrp_mole_people_fund').GetValue|0] offering. No rewards were granted."
