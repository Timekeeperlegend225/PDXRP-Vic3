l_english:
 pdxrp_mole_people.1.t: "The Whispers of the Hollow World"
 pdxrp_mole_people.1.d: "The world continues to get stranger as rumors appear of underground sentient races buried underneath the Earth's crust. Contact with these races has been minimal so far, but whispers abound of travelers and hikers encountering them during trips near caves and mountains. These subterranean inhabitants, called \"mole people\" in common parlance, may possess riches and knowledge that are alien to us. Perhaps if we traded with them, they might reward us."
 pdxrp_mole_people.1.a: "OK"
 pdxrp_announce_mole_people: "GM: The Coming of the Mole People"
 pdxrp_announce_mole_people_desc: "Show the event to all countries and start the shared one-year donation collection."
 je_pdxrp_mole_people: "The Coming of the Mole People"
 je_pdxrp_mole_people_status: "Worldwide donations: @money![GetGlobalVariable('pdxrp_mole_people_fund').GetValue|0]. Your donations: @money![GetPlayer.MakeScope.ScriptValue('pdxrp_mole_people_personal_donation')|0]."
 je_pdxrp_mole_people_reason: "Donate £1m or £5m repeatedly. Rewards after one year require £10m worldwide and scale up to £100m.\n\nMaximum: +20% birth rate, +50% minting, +100% company throughput bonus, +30 offense/defense, +10% construction efficiency. MPs: ×0.5; GPs, India and China: ×0.2. Non-donors: an additional ×0.5. Rewards decay over five years."
 pdxrp_mole_people_donate_one: "Give money to Mole People (£1 million)"
 pdxrp_mole_people_donate_one_desc: "Pay £1,000,000 from gold reserves into the shared fund. Repeatable."
 pdxrp_mole_people_donate_five: "Give money to Mole People (£5 million)"
 pdxrp_mole_people_donate_five_desc: "Pay £5,000,000 from gold reserves into the shared fund. Repeatable."
 pdxrp_mole_people_blessing: "Gifts of the Mole People"
 pdxrp_mole_people_blessing_desc: "Donation-funded bonuses, scaled by the shared fund, rank and participation. Decays over five years."
 pdxrp_restore_mole_people_collection: "GM: Restore Mole People Collection"
 pdxrp_restore_mole_people_collection_desc: "Add missing donation journals to all countries without resetting the shared fund or existing journals."
