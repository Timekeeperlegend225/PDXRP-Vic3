 setting_rule_overlord_veto_desc:0 "Determines how the overlord's veto interacts with subject law enactments."
 setting_rule_strong_veto:0 "Force Laws through"
 setting_rule_strong_veto_desc:0 "The overlord may veto or force through only normal subject law enactments."
 setting_rule_full_veto:0 "Full Veto"
 setting_rule_full_veto_desc:0 "The overlord may veto all laws, including player-imposed ones. Overlord Imposed may be forced through instantly."
 setting_rule_best_veto:0 "Full Veto & Automatic Forced Enactment"
 setting_rule_best_veto_desc:0 "The overlord may veto all laws, including player-imposed ones. Overlord Imposed laws are automatically forced through instantly."
 setting_rule_standard_veto:0 "Standard Veto"
 setting_rule_standard_veto_desc:0 "The overlord may veto or support only normal subject law enactments."
 setting_rule_expanded_veto:0 "Expanded Veto"
 setting_rule_expanded_veto_desc:0 "The overlord may veto or support all laws, including imposed law"
