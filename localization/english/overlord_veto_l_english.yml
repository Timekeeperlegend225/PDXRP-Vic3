l_english:
 overlord_veto.1.t:0 "[SCOPE.sCountry('veto_subject').GetName] seeks to enact [SCOPE.sLaw('current_law_scope').GetName]"
 overlord_veto.1.d:0 "[SCOPE.sCountry('veto_subject').GetName] has begun the process of enacting [SCOPE.sLaw('current_law_scope').GetName]. As their overlord, it falls to us to decide whether this change should proceed.\n\nDo we permit this law to move forward, or do we exercise our authority and block it?"
 overlord_veto.1.allow:0 "We will permit it."
 overlord_veto.1.veto:0 "Veto!"
 overlord_veto.1.force:0 "We will support this reform."
 overlord_veto.1.force_full:0 "We will force the law through!"
 overlord_veto_force_full_tooltip:0 "We will immediately push this law through!"
 overlord_veto.2.t:0 "Law Vetoed"
 overlord_veto.2.d:0 "Our tyrannical overlord has vetoed our law!"
 overlord_veto.2.confirm:0 "Tyranny!"
 overlord_veto:0 "Always Veto"
 overlord_veto_desc:0 "This will veto any law they attempt to pass."
 overlord_veto_tooltip:0 "We will automatically veto any attempt they make to pass a law"
 overlord_veto_end_tooltip:0 "We will allow them to pass their own laws"
 overlord_veto_allow_tooltip:0 "We will allow them to proceed with this law."
 overlord_veto_veto_tooltip:0 "We will prevent them from proceeding with this law."
 overlord_veto_force_tooltip:0 "We approve of their efforts to reform and will use our influence to help them pass this law"
 overlord_veto_action_propose_name:0 "Always Veto"
 overlord_veto_action_break_name:0 "Stop Vetoing" 
