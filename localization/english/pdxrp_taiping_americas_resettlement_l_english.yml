l_english:
 pdxrp_resettle_taiping_population_in_americas:0 "Resettle Taiping Han Migrants in the Americas"
 pdxrp_resettle_taiping_population_in_americas_desc:0 "Move roughly 5.5 to 6 million Han people from Taiping at the current save's population. The transfer percentages have been increased by about 27%; the actual total scales with the remaining Han population. Split them between Brazil, Mexico, Texas, Central America, and Bolivia in proportion to the supplied population figures, dividing each share equally among up to ten states with the most unused arable land. Additionally move 50,000 Han people to Hawaii's state with the most unused arable land. Other cultures are unaffected. Migrants retain their religion and arrive unemployed. Each transfer can happen once; if the main transfer is already complete, only Hawaii's transfer will occur."
