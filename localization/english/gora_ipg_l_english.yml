l_english:
 # GORA UI+ — Improved Parliament Graph: panel chrome + tooltips
 # Variable references match the names written by gora_ipg_seat_allocation.txt.
 # Note: legacy `bpmparl_*` keys (color-pointer tooltip system) have been
 # retired; the rank-based IPG keys below replace them entirely.

 # ─── Panel chrome ──────────────────────────────────────────────────────
 ipg_panel_title:0       "Parliament"
 ipg_expand:0            "Expand"
 ipg_collapse:0          "Collapse"
 ipg_view_power:0        "Power Structure"
 ipg_view_alignment:0    "Political Alignment"
 ipg_view_electoral:0    "Party Structure"
 ipg_power_desc:0        "Political strength of all Interest Groups."
 ipg_alignment_desc:0    "Population alignment by Interest Group."
 ipg_electoral_desc:0    "Seat distribution among Parties, Independent groups and minor factions."
 ipg_other_aligned:0     "Other Aligned"
 ipg_unaligned:0         "Politically Unaligned"
 ipg_other_minor:0       "Other Minor Groups"
 ipg_independent:0       "Independent"
 ipg_last_election:0     "Last Election"
 ipg_seats_unit:0        "Seats"

