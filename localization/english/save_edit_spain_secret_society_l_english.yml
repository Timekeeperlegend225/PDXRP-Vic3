l_english:
 save_edit_establish_spanish_secret_society: "Establish Spain's Secret Society"
 save_edit_establish_spanish_secret_society_desc: "Add the Armed Forces-sponsored Secret Society amendment to Spain's Presidential Republic. Engineers, academics, and officers gain +20 voting power and +50% political strength, at a cost of 200 authority. The amendment survives peaceful changes of governance but is not inherited by revolutionary regimes. Existing Positivist and Liberal movements gain +50% pop and character attraction; Constitutional Royalist and Absolutist Royalist movements receive -20% attraction and -20 percentage points of activism. Movement modifiers decay to zero over ten years. This decision can be taken once."
 save_edit_secret_society: "Secret Society"
 save_edit_secret_society_desc: "A secret society sponsored by the Armed Forces privileges engineers, academics, and officers in the affairs of state. It persists across peaceful changes of governance, but not revolutionary regime changes."
 save_edit_spanish_progressive_attraction: "Secret Society: Progressive Influence"
 save_edit_spanish_progressive_attraction_desc: "Secret support increases Positivist and Liberal attraction. This influence decays over ten years."
 save_edit_spanish_royalist_suppression: "Secret Society: Royalist Suppression"
 save_edit_spanish_royalist_suppression_desc: "Secret opposition reduces royalist attraction and activism. This influence decays over ten years."
 save_edit_repair_spanish_secret_society: "Restore Spain's Secret Society"
 save_edit_repair_spanish_secret_society_desc: "Restore the Armed Forces-sponsored Secret Society amendment if the original decision failed to add it. The movement modifiers are not applied again."
