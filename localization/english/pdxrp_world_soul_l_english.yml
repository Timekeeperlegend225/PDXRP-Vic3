 pdxrp_world_soul_readings:0 "Current temperature: #variable [GetGlobalVariable('pdxrp_world_soul_temperature').GetValue|1] C#!\n\nMonthly rise: [ROOT.GetCountry.GetCustom('pdxrp_world_soul_monthly_colored')]\nPopulation: [ROOT.GetCountry.GetCustom('pdxrp_world_soul_population_colored')]\nPollution: [ROOT.GetCountry.GetCustom('pdxrp_world_soul_pollution_colored')]\nRadicals: [ROOT.GetCountry.GetCustom('pdxrp_world_soul_radicals_colored')]\nDebt: [ROOT.GetCountry.GetCustom('pdxrp_world_soul_debt_colored')]\nTime: [ROOT.GetCountry.GetCustom('pdxrp_world_soul_time_colored')]\nInertia: #green -[ROOT.GetCountry.MakeScope.ScriptValue('pdxrp_world_soul_inertia_heat')|3] C#!"
 pdxrp_world_soul_default_text:0 "Each month, four countries with over 1m population receive Pop conversion and radicalism effects. Higher temperatures increase their strength and Lag Spike frequency."
 pdxrp_world_soul_below_80:0 "#red TOOHOTTOOHOTTOOHOT GETOUTGETOUTGETOUT\nTOOHOTTOOHOTTOOHOT GETOUTGETOUTGETOUT\nTOOHOTTOOHOTTOOHOT GETOUTGETOUTGETOUT\nTOOHOTTOOHOTTOOHOT GETOUTGETOUTGETOUT\nTOOHOTTOOHOTTOOHOT GETOUTGETOUTGETOUT\nTOOHOTTOOHOTTOOHOT GETOUTGETOUTGETOUT\nTOOHOTTOOHOTTOOHOT GETOUTGETOUTGETOUT\nTOOHOTTOOHOTTOOHOT GETOUTGETOUTGETOUT\nTOOHOTTOOHOTTOOHOT GETOUTGETOUTGETOUT\nTOOHOTTOOHOTTOOHOT GETOUTGETOUTGETOUT#!"
 pdxrp_world_soul_80_89:0 "#red WE'RE OUT#!"
 pdxrp_world_soul_monaco_text:0 "#bold Events#!\nFour random countries over 1 million people are hit each month. Only recipients get these effects:\nConversion: #variable [ROOT.GetCountry.MakeScope.ScriptValue('pdxrp_world_soul_conversion_rate')|%2]#! of non-Pops. Radicals: #variable [ROOT.GetCountry.MakeScope.ScriptValue('pdxrp_world_soul_radical_rate')|%2]#! of existing Pops.\nMultipliers: 60 C x2; 70 C x3; 80 C x5; 100 C x8.\n\n#bold Lag Spikes#!\nChance per harvest check: #variable [ROOT.GetCountry.MakeScope.ScriptValue('pdxrp_world_soul_lag_chance')|%2]#!. Start at 80 C; much more frequent at 90 C.\nMaximum penalties: -20 points MAPI, +500% pollution health effects, -50% tax capacity, infrastructure and manufacturing throughput. Half strength at 80 C; full strength at 90 C.\n\n100 C: global plague for six months (+100% mortality, -1 SoL, -60% agricultural throughput). 90 C: Iceland becomes Wasteland and its population is killed. 110 C: announce the Mole People and start donations.\n\nMonthly inertia subtracts 0.3% of the current temperature from warming, with a minimum rise of 0 C.\n\nOpen Chrome: +3 C. Open Window: -3 C. Maximum: 110 C."
 pdxrp_world_soul_over_90:0 "\n\n#red AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA#!"
 pdxrp_world_soul_no_overheat_text:0 ""
 pdxrp_world_soul_public_readings:0 "Current temperature: #variable [GetGlobalVariable('pdxrp_world_soul_temperature').GetValue|1] C#!\n\nThe world is getting warmer.\nLevel of pollution: [ROOT.GetCountry.GetCustom('pdxrp_world_soul_pollution_level')]\nExcess of population: [ROOT.GetCountry.GetCustom('pdxrp_world_soul_population_level')]\nWorld radicals: [ROOT.GetCountry.GetCustom('pdxrp_world_soul_radicals_level')]\nWorld debt: [ROOT.GetCountry.GetCustom('pdxrp_world_soul_debt_level')]\nTime: marching on."
