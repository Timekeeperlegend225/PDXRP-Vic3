l_english:
 pdxrp_transfer_turkish_population_to_anatolia: "Transfer Turkish Population to Anatolia"
 pdxrp_transfer_turkish_population_to_anatolia_desc: "Apply the agreed one-time transfer of half the Turkish population of Bulgaria and Greece to Ottoman Anatolia."
 pdxrp_transfer_turkish_population_to_anatolia_tt: "Move 50% of every Turkish pop in Bulgarian- and Greek-owned states to Ottoman-owned mainland Anatolian states. The remaining half stays in its original state. This decision can only be taken once worldwide."
