 pdxrp_plague.1.t: "Global Pandemic"
 pdxrp_plague.1.d: "As the era of instability continues, reports are that a new and deadly disease has affected every nation simultaneously. News from the HOST has attributed this to aggressive Pop meddling in the World Processing Unit. The HOST assures us that this disease will be stripped out of the SAVE FILE within 6 months."
 pdxrp_plague.1.a: "We must strike down these Pops!"
