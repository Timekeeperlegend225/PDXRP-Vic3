l_english:
 pdxrp_establish_lenin_government: "Establish Lenin's Government in Russia"
 pdxrp_establish_lenin_government_desc: "Establish a Council Republic with State Atheism, Universal Suffrage, and Factory Councils. Appoint Lenin as Trade Unions leader, Trotsky as Armed Forces leader, and a Communist as Rural Folk leader. Shift political power toward workers and peasants for ten years, and permanently reduce Socialist Movement radicalism by 100%. Can be taken once worldwide."
 pdxrp_establish_lenin_government_tt: "Russia immediately adopts Council Republic, State Atheism, Universal Suffrage, and Factory Councils. Lenin becomes Trade Unions leader; Trotsky becomes Armed Forces leader. Reuse existing historical characters in Russia when available. The Rural Folk leader becomes Communist. Trade Unions gain +100% political strength and +100% pop attraction; Rural Folk gain +50% of each. The Orthodox Church, Landowners, and Industrialists each receive -75% political strength. All five interest-group modifiers gradually decay to zero over 10 years. Additionally, existing and future Socialist Movements in Russia permanently receive -100% movement radicalism (activism)."
 pdxrp_revolution_union_support: "Workers' Revolutionary Ascendancy"
 pdxrp_revolution_rural_support: "Peasant Revolutionary Support"
 pdxrp_revolution_old_order_suppressed: "Old Order Suppressed"
 pdxrp_launch_tsarist_restoration: "March on Sankt Petersburg"
 pdxrp_launch_tsarist_restoration_desc: "Down with the Soviets."
 pdxrp_launch_tsarist_restoration_tt: "Russia immediately starts an Annex Subject war against Tsarist Forces; Tsarist Forces demand Regime Change in Russia. Incorporation, military bonuses, and renaming are handled by the separate preparation decision."
 pdxrp_tsarist_forces_name: "Tsarist Forces"
 pdxrp_tsarist_forces_adj: "Tsarist"
 pdxrp_tsarist_restoration_war: "War of the Tsarist Restoration"
 pdxrp_prepare_tsarist_forces: "Organize White Forces"
 pdxrp_prepare_tsarist_forces_desc: "Prepare for war."
 pdxrp_prepare_tsarist_forces_tt: "The Baltic Governorate incorporates all its states and permanently receives A Land War in China: +10% defense in owned provinces, +10 flat training rate, +10% training rate, and +2 organization gain. Rename it Tsarist Forces. Create a Tsarist Volunteer Army with 65 Skirmish Infantry and 65 Shrapnel Artillery battalions, adding 130 regular barracks levels. The most populous state receives 17 of each type and the next three receive 16 of each; missing destination states fall back to the largest state. Gain +500% training rate and +50 organization gain for six months, alongside the permanent military modifier. These recruits must fill their ranks locally. Declare war separately with March on Sankt Petersburg."
 pdxrp_tsarist_rapid_training: "Tsarist Emergency Training"
 pdxrp_tsarist_volunteer_army: "Tsarist Volunteer Army"
 pdxrp_soviet_socialist_pacification: "Socialist Revolutionary Settlement"
 pdxrp_move_baltic_capital_to_arkhangelsk: "Move the Baltic Capital to Arkhangelsk"
 pdxrp_move_baltic_capital_to_arkhangelsk_desc: "Establish Arkhangelsk as the capital of the Baltic Governorate. Requires ownership of a state in Arkhangelsk. Can be taken once."
