l_german:
 overlord_veto.1.t:0 "[SCOPE.sCountry('veto_subject').GetName] versucht, [SCOPE.sLaw('current_law_scope').GetName] zu erlassen"
 overlord_veto.1.d:0 "[SCOPE.sCountry('veto_subject').GetName] hat den Prozess zur Verabschiedung von [SCOPE.sLaw('current_law_scope').GetName] begonnen. Als ihr Oberherr müssen wir entscheiden, ob dieses Gesetz weiter voranschreiten darf.\n\nLassen wir es zu oder blockieren wir es?"
 overlord_veto.1.allow:0 "Wir erlauben es."
 overlord_veto.1.veto:0 "Veto!"
 overlord_veto.1.force:0 "Wir unterstützen diese Reform."
 overlord_veto.1.force_full:0 "Wir werden dieses Gesetz sofort durchsetzen!"
 overlord_veto_force_full_tooltip:0 "Wir setzen dieses Gesetz sofort durch!"
 overlord_veto.2.t:0 "Gesetz vetoiert"
 overlord_veto.2.d:0 "Unser tyrannischer Oberherr hat unser Gesetz vetoiert!"
 overlord_veto.2.confirm:0 "Tyrannei!"
 overlord_veto:0 "Immer Veto"
 overlord_veto_desc:0 "Vetoiert jedes Gesetz, das der Untertan zu verabschieden versucht."
 overlord_veto_tooltip:0 "Wir vetoeiren automatisch jeden Gesetzesversuch."
 overlord_veto_end_tooltip:0 "Wir erlauben ihnen, ihre eigenen Gesetze zu verabschieden."
 overlord_veto_allow_tooltip:0 "Wir erlauben ihnen, mit diesem Gesetz fortzufahren."
 overlord_veto_veto_tooltip:0 "Wir verhindern, dass dieses Gesetz weiter voranschreitet."
 overlord_veto_force_tooltip:0 "Wir unterstützen ihre Reformbemühungen und nutzen unseren Einfluss, um das Gesetz durchzubringen."
 overlord_veto_action_propose_name:0 "Immer Veto"
 overlord_veto_action_break_name:0 "Veto beenden"
 setting_rule_overlord_veto:0 "Veto‑Modus des Oberherrn"
 setting_rule_overlord_veto_desc:0 "Legt fest, wie das Veto des Oberherrn mit den Gesetzesprozessen der Untertanen interagiert."
 setting_rule_strong_veto:0 "Gesetze erzwingen"
 setting_rule_strong_veto_desc:0 "Der Oberherr kann nur normale Untertanengesetze vetoeiren oder erzwingen."
 setting_rule_full_veto:0 "Vollständiges Veto"
 setting_rule_full_veto_desc:0 "Der Oberherr kann alle Gesetze vetoeiren, auch vom Spieler erzwungene. Vom Oberherrn erzwungene Gesetze können sofort verabschiedet werden."
 setting_rule_best_veto:0 "Vollveto & automatische Verabschiedung"
 setting_rule_best_veto_desc:0 "Der Oberherr kann alle Gesetze vetoeiren. Vom Oberherrn erzwungene Gesetze werden automatisch sofort verabschiedet."
 setting_rule_standard_veto:0 "Standardveto"
 setting_rule_standard_veto_desc:0 "Der Oberherr kann nur normale Gesetzesinitiativen vetoeiren oder unterstützen."
 setting_rule_expanded_veto:0 "Erweitertes Veto"
 setting_rule_expanded_veto_desc:0 "Der Oberherr kann alle Gesetze vetoeiren oder unterstützen, einschließlich erzwungener."
 rule_rule_overlord_veto:0 "Regel: Veto des Oberherrn"
