l_korean:
 overlord_veto.1.t:0 "[SCOPE.sCountry('veto_subject').GetName](이)가 [SCOPE.sLaw('current_law_scope').GetName] 제정을 추진합니다"
 overlord_veto.1.d:0 "[SCOPE.sCountry('veto_subject').GetName](이)가 [SCOPE.sLaw('current_law_scope').GetName] 제정 절차를 시작했습니다. 종주국으로서 우리는 이 변화가 진행되어야 하는지 결정해야 합니다.\n\n이 법안을 허용할 것인지, 아니면 권한을 행사해 막을 것인지 선택해야 합니다."
 overlord_veto.1.allow:0 "허용한다."
 overlord_veto.1.veto:0 "거부한다!"
 overlord_veto.1.force:0 "우리는 이 개혁을 지지한다."
 overlord_veto.1.force_full:0 "우리는 이 법안을 즉시 통과시킬 것이다!"
 overlord_veto_force_full_tooltip:0 "이 법안을 즉시 통과시킵니다!"
 overlord_veto.2.t:0 "법안 거부됨"
 overlord_veto.2.d:0 "우리의 폭군 같은 종주국이 우리의 법안을 거부했습니다!"
 overlord_veto.2.confirm:0 "폭정이다!"
 overlord_veto:0 "항상 거부"
 overlord_veto_desc:0 "종속국이 제정하려는 모든 법안을 거부합니다."
 overlord_veto_tooltip:0 "종속국의 모든 법안 제정 시도를 자동으로 거부합니다."
 overlord_veto_end_tooltip:0 "그들이 스스로 법안을 제정하도록 허용합니다."
 overlord_veto_allow_tooltip:0 "이 법안을 진행하도록 허용합니다."
 overlord_veto_veto_tooltip:0 "이 법안의 진행을 막습니다."
 overlord_veto_force_tooltip:0 "그들의 개혁 노력을 지지하며, 법안 통과를 돕기 위해 영향력을 행사합니다."
 overlord_veto_action_propose_name:0 "항상 거부"
 overlord_veto_action_break_name:0 "거부 중단"
 setting_rule_overlord_veto:0 "종주국 거부 모드"
 setting_rule_overlord_veto_desc:0 "종주국의 거부권이 종속국의 법 제정에 어떻게 작용하는지 결정합니다."
 setting_rule_strong_veto:0 "법안 강제"
 setting_rule_strong_veto_desc:0 "종주국은 종속국의 일반 법안만 거부하거나 강제할 수 있습니다."
 setting_rule_full_veto:0 "완전 거부"
 setting_rule_full_veto_desc:0 "종주국은 플레이어가 강제로 제정한 법을 포함한 모든 법안을 거부할 수 있습니다. 종주국이 강제한 법은 즉시 통과될 수 있습니다."
 setting_rule_best_veto:0 "완전 거부 & 자동 즉시 통과"
 setting_rule_best_veto_desc:0 "종주국은 모든 법안을 거부할 수 있으며, 종주국이 강제한 법은 자동으로 즉시 통과됩니다."
 setting_rule_standard_veto:0 "표준 거부"
 setting_rule_standard_veto_desc:0 "종주국은 종속국의 일반 법안만 거부하거나 지원할 수 있습니다."
 setting_rule_expanded_veto:0 "확장 거부"
 setting_rule_expanded_veto_desc:0 "종주국은 강제된 법안을 포함한 모든 법안을 거부하거나 지원할 수 있습니다."
 rule_rule_overlord_veto:0 "종주국 거부 규칙"
