l_french:
 overlord_veto.1.t:0 "[SCOPE.sCountry('veto_subject').GetName] cherche à promulguer [SCOPE.sLaw('current_law_scope').GetName]"
 overlord_veto.1.d:0 "[SCOPE.sCountry('veto_subject').GetName] a entamé le processus de promulgation de [SCOPE.sLaw('current_law_scope').GetName]. En tant que suzerain, il nous revient de décider si ce changement doit aller de l’avant.\n\nAutorisons‑nous cette loi à progresser, ou exerçons‑nous notre autorité pour la bloquer ?"
 overlord_veto.1.allow:0 "Nous l’autoriserons."
 overlord_veto.1.veto:0 "Veto !"
 overlord_veto.1.force:0 "Nous soutiendrons cette réforme."
 overlord_veto.1.force_full:0 "Nous ferons adopter cette loi immédiatement !"
 overlord_veto_force_full_tooltip:0 "Nous ferons adopter cette loi sur‑le‑champ !"
 overlord_veto.2.t:0 "Loi mise en veto"
 overlord_veto.2.d:0 "Notre suzerain tyrannique a opposé son veto à notre loi !"
 overlord_veto.2.confirm:0 "Tyrannie !"
 overlord_veto:0 "Veto permanent"
 overlord_veto_desc:0 "Oppose un veto à toute loi que le sujet tente de promulguer."
 overlord_veto_tooltip:0 "Nous opposerons automatiquement notre veto à toute tentative de promulgation."
 overlord_veto_end_tooltip:0 "Nous leur permettrons de promulguer leurs propres lois."
 overlord_veto_allow_tooltip:0 "Nous les autoriserons à poursuivre cette loi."
 overlord_veto_veto_tooltip:0 "Nous empêcherons la poursuite de cette loi."
 overlord_veto_force_tooltip:0 "Nous soutenons leurs efforts de réforme et utiliserons notre influence pour les aider à faire adopter cette loi."
 overlord_veto_action_propose_name:0 "Veto permanent"
 overlord_veto_action_break_name:0 "Cesser le veto"
 setting_rule_overlord_veto:0 "Mode de veto du suzerain"
 setting_rule_overlord_veto_desc:0 "Détermine comment le veto du suzerain interagit avec les promulgations de lois des sujets."
 setting_rule_strong_veto:0 "Forcer les lois"
 setting_rule_strong_veto_desc:0 "Le suzerain peut veto ou imposer uniquement les lois normales des sujets."
 setting_rule_full_veto:0 "Veto total"
 setting_rule_full_veto_desc:0 "Le suzerain peut veto toutes les lois, y compris celles imposées par le joueur. Les lois imposées peuvent être adoptées instantanément."
 setting_rule_best_veto:0 "Veto total & adoption automatique"
 setting_rule_best_veto_desc:0 "Le suzerain peut veto toutes les lois, y compris celles imposées par le joueur. Les lois imposées sont automatiquement adoptées."
 setting_rule_standard_veto:0 "Veto standard"
 setting_rule_standard_veto_desc:0 "Le suzerain peut veto ou soutenir uniquement les lois normales des sujets."
 setting_rule_expanded_veto:0 "Veto étendu"
 setting_rule_expanded_veto_desc:0 "Le suzerain peut veto ou soutenir toutes les lois, y compris les lois imposées."
 rule_rule_overlord_veto:0 "Règle de veto du suzerain"
